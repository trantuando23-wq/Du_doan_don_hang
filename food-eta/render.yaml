services:
  - type: web
    name: food-eta
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python src/generate_data.py && python src/train.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"

